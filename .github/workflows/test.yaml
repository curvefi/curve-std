name: tests-boa

on: [push]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HYPOTHESIS_PROFILE: no-shrink

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2
        with:
          enable-cache: true
          cache-python: true
          prune-cache: false
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/.python-version

      - name: Install Requirements
        run: uv sync --frozen --managed-python

      - name: Run pre-commit checks
        run: uv run --managed-python pre-commit run --all-files --show-diff-on-failure


  tests:
    needs: pre-commit
    name: ${{ matrix.folder }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: "tests/unitary"
            runs-on: "ubuntu-latest"
          - folder: "tests/e2e"
            runs-on: "ubuntu-latest"
          - folder: "tests/fuzzing"
            runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7.2
        with:
          enable-cache: true
          cache-python: true
          prune-cache: false
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/.python-version

      - name: Cache Compiler Installations
        uses: actions/cache@v5
        with:
          path: |
            ~/.vvm
          key: compiler-cache-${{ hashFiles('**/uv.lock') }}

      - name: Install Requirements
        run: uv sync --frozen --managed-python

      - name: Run tests
        run: uv run --managed-python pytest ${{ matrix.folder }} -n auto
