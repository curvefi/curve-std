[project]
name = "curve-std"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "vyper==0.4.3",
    "snekmate>=0.1.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curve_std"]

[dependency-groups]
dev = [
    "hypothesis>=6.148.7",
    "pytest>=9.0.3",
    "titanoboa>=0.2.8",
    "pre-commit==4.3.0",
    "pytest-xdist>=3.5",
]
